# Streamlit theming.
#
# The stylesheet in pas/ui/theme.py cannot reach widget internals — radio
# accents, tab underlines, toggle fills, the toolbar — because Streamlit renders
# those from its own theme. Without this file the base theme stays light and its
# default red accent (#FF4B4B) clashes with the purple/cyan palette.
#
# Set these here rather than piling on more CSS overrides: this is the supported
# mechanism and it fixes the cause instead of the symptoms.

[theme]
base = "dark"
primaryColor = "#4b8bf5"
backgroundColor = "#1b2130"
secondaryBackgroundColor = "#222939"
textColor = "#eef1f6"
linkColor = "#4b8bf5"
codeBackgroundColor = "#293143"
borderColor = "#333c4e"
font = "sans-serif"

[server]
# Loopback only. Combined with authentication being off by default, binding
# wider would expose every analysis to anyone who can route to this machine.
address = "localhost"
headless = true

[browser]
gatherUsageStats = false
